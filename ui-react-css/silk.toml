[package]
main = "tasks.silk"
name = "ui-react-css"
description = "A Silk UI app styled with a plain CSS stylesheet, written in React, with Vite: silk dev, silk build"
version = "0.1.0"
silk-version = "0.1.0-dev.100+8f42b4e7342a"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "7cc45447843698d7a7f3708a9707b837d156f610", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "7cc45447843698d7a7f3708a9707b837d156f610", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "7cc45447843698d7a7f3708a9707b837d156f610", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "7cc45447843698d7a7f3708a9707b837d156f610", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "7cc45447843698d7a7f3708a9707b837d156f610", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "f7f07787c9c612eaeb686d04afcdbd6749e8b7f7", path = "modules/runtime", package = "silkjs-runtime" }

[template]
# What `silk init` suggests running in the new project, after `cd` into it.
next-steps = [
  { run = "silk dev", description = "open the app, and update it as you edit" },
  { run = "silk build --release --out dist", description = "build the release program and copy it to dist/" },
]
