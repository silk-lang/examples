[package]
name = "ui-loom-css"
description = "A Silk UI app written in Loom and styled with a plain CSS stylesheet: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
source = "silk"
kind = "library"
main = "app.silk"
exports = ["app"]

# The app is the app module: silkui generates the host that opens it, taking Loom's hosts
# from this same loom dependency, so the app and the host share one Loom.
[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "e2fdea349c9d4dcdc53ef055db04999c02d433f8", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "5f174438e42f43dfe76f2e834751b96b0c991890", path = "modules/silkui", package = "silkui" }
