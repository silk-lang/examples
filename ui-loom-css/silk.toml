[package]
name = "ui-loom-css"
description = "A Silk UI app written in Loom and styled with a plain CSS stylesheet: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app"]

# The app is the app module: silkui generates the host that opens it, taking Loom's hosts
# from this same loom dependency, so the app and the host share one Loom.
[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "afd5e368bfb9133df5a9e085d6c26499ca6f1928", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "0a9375e42842c344f86996ec98c990d385218f5d", path = "modules/silkui", package = "silkui" }
