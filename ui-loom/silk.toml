[package]
name = "ui-loom"
description = "A Silk UI app written in Loom, Silk's own UI framework: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app"]

# The app is the app module: silkui generates the host that opens it, taking Loom's hosts
# from this same loom dependency, so the app and the host share one Loom.
[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "960cc082f0cf8af6fbefaa41e5e2a706ed7df74b", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "b3d824b7aad3507f31f1188d5b77ca0f38fb89c6", path = "modules/silkui", package = "silkui" }
