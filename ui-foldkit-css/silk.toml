[package]
name = "ui-foldkit-css"
description = "A Silk UI app styled with a plain CSS stylesheet, written in Foldkit, with Vite: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "0a9375e42842c344f86996ec98c990d385218f5d", path = "modules/silkui", package = "silkui" }
