[package]
main = "tasks.silk"
name = "ui-js-css"
description = "A Silk UI app styled with a plain CSS stylesheet, written in plain JavaScript or TypeScript, with Vite: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "48e78f3dd6588324169d6718c5a603cc6e3cfc1f", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "48e78f3dd6588324169d6718c5a603cc6e3cfc1f", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "48e78f3dd6588324169d6718c5a603cc6e3cfc1f", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "48e78f3dd6588324169d6718c5a603cc6e3cfc1f", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "48e78f3dd6588324169d6718c5a603cc6e3cfc1f", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "8d9fa3a1d9f337209bb0f90d56dace5ea762f3ce", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "8d9fa3a1d9f337209bb0f90d56dace5ea762f3ce", path = "modules/runtime", package = "silkjs-runtime" }
