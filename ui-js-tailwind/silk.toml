[package]
name = "ui-js-tailwind"
description = "Tailwind CSS variant: A Silk UI app written in plain JavaScript or TypeScript, with Vite: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "3a0570dc2e184bef2805c8929402f96155e43bc9", path = "modules/silkui", package = "silkui" }
