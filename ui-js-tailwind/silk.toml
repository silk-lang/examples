[package]
name = "ui-js-tailwind"
description = "Tailwind CSS variant: A Silk UI app written in plain JavaScript or TypeScript, with Vite: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
source = "silk"

# The app is JavaScript, in js/. Silk builds the tasks, which build and run the app, and
# silk/main.silk, which `silk run` runs: it starts `silk task dev`.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "5f174438e42f43dfe76f2e834751b96b0c991890", path = "modules/silkui", package = "silkui" }
