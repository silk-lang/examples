[package]
name = "ui-foldkit-tailwind"
description = "Tailwind CSS variant: A Silk UI app written in Foldkit, with Vite: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "2e4f69550be1a57edc120d4a96b3181c3f9bc7c7", path = "modules/silkui", package = "silkui" }
