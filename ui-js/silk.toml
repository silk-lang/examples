[package]
name = "ui-js"
description = "A Silk UI app written in plain JavaScript or TypeScript, with Vite: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "7e2c69f3043b3987b83d69e92e2b8634acd4c14d", path = "modules/silkui", package = "silkui" }
