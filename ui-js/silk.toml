[package]
main = "tasks.silk"
name = "ui-js"
description = "A Silk UI app written in plain JavaScript or TypeScript, with Vite: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"

# The app is JavaScript, in web/. Silk only builds the tasks, which build and run the app.
[dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/silkui", package = "silkui" }
silkui_window = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/silkui/window", package = "silkui-window" }
silkui_window_node = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/silkui/window/node", package = "silkui-window-node" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "7a78ea4edcc994505e08e65e1014c9ea937ec22a", path = "modules/inspect/server", package = "ui-inspect-server" }
silkjs = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "748705385e6d15a2fd1db02f546b873dbc015ef8", path = "modules/engine", package = "silkjs-engine" }
node_runtime = { git = "https://github.com/silk-lang/lib-silkjs.git", rev = "748705385e6d15a2fd1db02f546b873dbc015ef8", path = "modules/runtime", package = "silkjs-runtime" }
