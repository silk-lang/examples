[package]
name = "ui-loom-tailwind"
description = "Tailwind CSS variant: A Silk UI app written in Loom, Silk's own UI framework: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app"]

# The app is the app module: silkui generates the host that opens it, taking Loom's hosts
# from this same loom dependency, so the app and the host share one Loom.
[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "ed8f0d1be57f1beaa9a864d6a25ef746afb04f04", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "d644da0974ee277da599c246881315579937fb7b", path = "modules/silkui", package = "silkui" }
tailwind = { git = "https://github.com/silk-lang/silkui.git", rev = "d644da0974ee277da599c246881315579937fb7b", path = "modules/tailwind", package = "ui-tailwind" }
