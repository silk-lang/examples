[package]
name = "ui-loom-tailwind"
description = "Tailwind CSS variant: A Silk UI app written in Loom, Silk's own UI framework: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"
kind = "library"
main = "app.silk"
exports = ["app"]

# The app is the app module: silkui generates the host that opens it, taking Loom's hosts
# from this same loom dependency, so the app and the host share one Loom.
[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "c7d6ffc4315851bc0083c6f50bbcc09a11e1f717", path = "modules/loom", package = "loom" }

silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "5d6c9f4d3aefb69327b2305e451db18c140886a8", path = "modules/silkui", package = "silkui" }
silkui_window_loom = { git = "https://github.com/silk-lang/loom.git", rev = "c7d6ffc4315851bc0083c6f50bbcc09a11e1f717", path = "modules/silkui/window", package = "silkui-window-loom" }
silkui_web_canvas = { git = "https://github.com/silk-lang/loom.git", rev = "c7d6ffc4315851bc0083c6f50bbcc09a11e1f717", path = "modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { git = "https://github.com/silk-lang/loom.git", rev = "c7d6ffc4315851bc0083c6f50bbcc09a11e1f717", path = "modules/silkui/web/dom", package = "silkui-web-dom" }
loom_dom = { git = "https://github.com/silk-lang/loom.git", rev = "c7d6ffc4315851bc0083c6f50bbcc09a11e1f717", path = "modules/loom/dom", package = "loom-dom" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "5d6c9f4d3aefb69327b2305e451db18c140886a8", path = "modules/tree/window", package = "ui-tree-window" }
platform_window = { git = "https://github.com/silk-lang/lib-native.git", rev = "0ac590de9ee1950f384725432829f6afa656f4ed", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "0ac590de9ee1950f384725432829f6afa656f4ed", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "5d6c9f4d3aefb69327b2305e451db18c140886a8", path = "modules/tree", package = "ui-tree" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "5d6c9f4d3aefb69327b2305e451db18c140886a8", path = "modules/inspect/server", package = "ui-inspect-server" }
tailwind = { git = "https://github.com/silk-lang/silkui.git", rev = "5d6c9f4d3aefb69327b2305e451db18c140886a8", path = "modules/tailwind", package = "ui-tailwind" }
