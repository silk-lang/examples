[package]
name = "ui-loom-tailwind"
description = "Tailwind CSS variant: A Silk UI app written in Loom, Silk's own UI framework: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app"]

# The app is the app module: silkui generates the host that opens it, taking Loom's hosts
# from this same loom dependency, so the app and the host share one Loom.
[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "9d3ce95a749b243e3c9528587bf2854422f4eb89", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "eaaeb7541746dae1f5b4b2d8672b79b68ad8f6c0", path = "modules/silkui", package = "silkui" }
tailwind = { git = "https://github.com/silk-lang/silkui.git", rev = "eaaeb7541746dae1f5b4b2d8672b79b68ad8f6c0", path = "modules/tailwind", package = "ui-tailwind" }
