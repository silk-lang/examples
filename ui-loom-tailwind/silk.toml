[package]
name = "ui-loom-tailwind"
description = "Tailwind CSS variant: A Silk UI app written in Loom, Silk's own UI framework: silk task dev, silk task build"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app"]

# The app is the app module: silkui generates the host that opens it, taking Loom's hosts
# from this same loom dependency, so the app and the host share one Loom.
[dependencies]
loom = { git = "https://github.com/silk-lang/loom.git", rev = "82e64a9ce6775a964921d06a4e4433ae493a89cb", path = "modules/loom", package = "loom" }

[profiles.tasks]
main = "tasks.silk"

[profiles.tasks.dependencies]
silkui = { git = "https://github.com/silk-lang/silkui.git", rev = "c6ef53b33f118fb9e57946f6fff30f18f2581b3b", path = "modules/silkui", package = "silkui" }
tailwind = { git = "https://github.com/silk-lang/silkui.git", rev = "c6ef53b33f118fb9e57946f6fff30f18f2581b3b", path = "modules/tailwind", package = "ui-tailwind" }
